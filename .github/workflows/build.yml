name: Compile and Publish Cross-Platform Releases

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push any version tag (e.g., v0.1.0-alpha)

jobs:
  # STAGE 1: Build the executables on native operating system workers
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: genmd-linux
            output_name: genmd
          - os: windows-latest
            artifact_name: genmd-windows
            output_name: genmd.exe
          - os: macos-latest
            artifact_name: genmd-macos
            output_name: genmd

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up uv Engine
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Pin Python Environment and Sync Workspace
        run: |
          uv python install 3.14
          uv sync --frozen

      - name: Build Standalone Binary with Nuitka via UV
        run: |
          uv run python -m nuitka --onefile --disable-ccache --output-filename=${{ matrix.output_name }} main.py

      # Safely store the binary inside GitHub's temporary task cache
      - name: Upload Binary to Stage Storage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_name }}

  # STAGE 2: Aggregate the assets and push them directly to GitHub Releases
  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the workflow explicit permission to create releases and upload files

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      # Collects the files generated by your parallel jobs
      - name: Download all compiled binaries
        uses: actions/download-artifact@v4
        with:
          path: output-assets

      # Cleans up folder nesting so everything sits neatly in a flat directory for upload
      - name: Organize Release Directory Structure
        run: |
          mkdir release-dist
          cp output-assets/genmd-linux/genmd release-dist/genmd-linux
          cp output-assets/genmd-windows/genmd.exe release-dist/genmd-windows.exe
          cp output-assets/genmd-macos/genmd release-dist/genmd-macos

      # Generates the release interface, auto-writes changelogs, and pins assets
      - name: Generate GitHub Release and Attach Binaries
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-dist/*"
          generateReleaseNotes: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
